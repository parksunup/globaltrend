name: Daily Crawlee source collectors

on:
  workflow_dispatch:
    inputs:
      actual_collection:
        description: Run a one-time production collection and write accepted results to Supabase
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: globaltrend-crawlee-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'parksunup/globaltrend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COLLECTOR_RUNNER: github-hosted
      COLLECTOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_EVENT: ${{ github.event_name }}
      SCHEDULE_ENABLED: ${{ vars.SCHEDULE_ENABLED }}
      COLLECTION_ENABLED: ${{ vars.COLLECTION_ENABLED }}
      FREE_LIMITS_VERIFIED: ${{ vars.FREE_LIMITS_VERIFIED }}
      CLOUD_PIPELINE_VERIFIED: ${{ vars.CLOUD_PIPELINE_VERIFIED }}
      SUPABASE_URL: ${{ secrets.COLLECTOR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.COLLECTOR_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Crawlee collector dependencies
        run: python -m pip install -r scripts/collector/requirements.txt
      - name: Validate Crawlee collector
        run: python -m unittest discover -s tests -p 'test_collector*.py'
      - name: Collect the PR #114 Crawlee source set
        id: collect
        env:
          COLLECTOR_ACTUAL_RUNNER: ${{ runner.environment }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ '${{ inputs.actual_collection }}' = 'true' ]; then
            python -m scripts.collector.run --scheduled --write \
              --source-set config/crawlee-daily-source-set.json \
              --output work/crawlee-daily-result.json
          else
            python -m scripts.collector.run --probe \
              --source-set config/crawlee-daily-source-set.json \
              --output work/crawlee-daily-result.json
          fi
      - name: Summarize source results
        if: always()
        env:
          RESULT_PATH: work/crawlee-daily-result.json
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RESULT_PATH'])
          if path.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Crawlee daily collection result\n\n```json\n')
                  summary.write(path.read_text(encoding='utf-8')[:20000])
                  summary.write('\n```\n')
          PY
