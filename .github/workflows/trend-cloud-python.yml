name: Daily cloud Python collector

on:
  # Supabase Cron dispatches this workflow at 06:00 KST.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globaltrend-cloud-python-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.COLLECTOR_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.COLLECTOR_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source PDF OCR and source languages
        run: |
          sudo apt-get update
          sudo apt-get install -y ocrmypdf tesseract-ocr-eng tesseract-ocr-spa tesseract-ocr-fra tesseract-ocr-jpn tesseract-ocr-nld tesseract-ocr-por tesseract-ocr-chi-sim tesseract-ocr-chi-tra
      - name: Install collector dependencies
        run: python -m pip install -r scripts/collector/requirements.txt Pillow==12.0.0
      - name: Verify scanned PDF OCR
        run: python -m unittest tests.test_pdf_ocr_runtime
      - name: Validate collector and cloud worker
        run: python -m unittest discover -s tests -p 'test_collector*.py'
      - name: Validate durable snapshot cursor regression
        run: python -m unittest discover -s tests -p 'test_cloud_snapshot_cursor.py'
      - name: Consume every enabled cloud Python source queue
        run: python -m scripts.collector.cloud_worker
