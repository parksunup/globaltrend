name: Business Advisor Desktop Release

on:
  push:
    tags:
      - "business-advisor-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/business-advisor-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/business-advisor-desktop
        run: npm ci

      - name: Build Windows application archive
        working-directory: apps/business-advisor-desktop
        run: npm run dist:win

      - name: Publish tagged release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" apps/business-advisor-desktop/release/GlobalTrend-Business-Advisor-*.zip \
            --verify-tag \
            --title "GlobalTrend 기업 개인정보 보호 도우미 ${TAG_NAME#business-advisor-}" \
            --generate-notes

