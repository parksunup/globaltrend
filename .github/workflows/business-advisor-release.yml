name: Business Advisor Desktop Release

on:
  push:
    tags:
      - "business-advisor-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/business-advisor-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/business-advisor-desktop
        run: npm ci

      - name: Build single-file Windows application
        working-directory: apps/business-advisor-desktop
        run: npm run dist:win

      - name: Publish tagged release asset
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME;
            const assetName = '\uAD6D\uC81C\uC694\uC815 \uC0C1\uB2F4\uC18C.exe';
            const assetPath = path.join(process.env.GITHUB_WORKSPACE, 'apps', 'business-advisor-desktop', 'release', assetName);
            if (!fs.existsSync(assetPath)) throw new Error(`Built application was not found: ${assetPath}`);
            const stat = fs.statSync(assetPath);

            let release;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            release = releases.find(item => item.tag_name === tag);
            if (!release) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `국제요정 상담소 ${tag.replace(/^business-advisor-/, '')}`,
                generate_release_notes: true,
              });
              release = created.data;
            }

            const existing = release.assets.find(asset => asset.name === assetName);
            if (existing) {
              if (existing.size !== stat.size) throw new Error(`Release already contains ${existing.name} with a different size.`);
              core.info(`Verified existing release asset ${existing.name} (${existing.size} bytes).`);
              return;
            }
            if (release.assets.length) throw new Error(`Release ${tag} already contains unexpected assets: ${release.assets.map(asset => asset.name).join(', ')}`);

            const bytes = fs.readFileSync(assetPath);
            const uploaded = await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data: bytes,
              headers: {
                'content-type': 'application/vnd.microsoft.portable-executable',
                'content-length': String(stat.size),
              },
            });
            const verified = await github.rest.repos.getReleaseAsset({ owner, repo, asset_id: uploaded.data.id });
            if (uploaded.data.name !== assetName || verified.data.name !== assetName || verified.data.size !== stat.size) {
              throw new Error(`Release asset verification failed: upload=${uploaded.data.name}, read-back=${verified.data.name}, size=${verified.data.size}/${stat.size}.`);
            }
            core.info(`Published and re-read ${verified.data.name} (${verified.data.size} bytes).`);

