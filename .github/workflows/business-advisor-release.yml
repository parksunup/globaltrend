name: Business Advisor Desktop Release

on:
  push:
    tags:
      - "business-advisor-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/business-advisor-desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/business-advisor-desktop
        run: npm ci

      - name: Build single-file Windows application
        working-directory: apps/business-advisor-desktop
        run: npm run dist:win

      - name: Publish tagged release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $assetPath = Join-Path $env:GITHUB_WORKSPACE 'apps/business-advisor-desktop/release/국제요정 상담소.exe'
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Built application was not found: $assetPath"
          }

          gh release create $env:TAG_NAME `
            --verify-tag `
            --title "국제요정 상담소 $($env:TAG_NAME -replace '^business-advisor-', '')" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_NAME" | ConvertFrom-Json
          if (-not $release.upload_url) { throw 'GitHub did not return a release asset upload URL.' }
          Write-Host "Uploading $([IO.Path]::GetFileName($assetPath)) with GitHub's binary request body and explicit asset name."
          $assetResponse = gh api `
            --hostname uploads.github.com `
            --method POST `
            "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets" `
            --header 'Accept: application/vnd.github+json' `
            --header 'Content-Type: application/octet-stream' `
            --field "name=국제요정 상담소.exe" `
            --input $assetPath
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed (gh api exit $LASTEXITCODE)." }
          $asset = $assetResponse | ConvertFrom-Json

          if ($asset.name -cne '국제요정 상담소.exe') {
            throw "GitHub registered the wrong release filename: $($asset.name)"
          }
          Write-Host "Published release asset: $($asset.name) ($($asset.size) bytes)"

