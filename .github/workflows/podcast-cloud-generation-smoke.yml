name: One-time NotebookLM cloud generation test

on:
  push:
    branches: [codex/weekly-podcast-publication]
    paths: [.github/workflows/podcast-cloud-generation-smoke.yml]

permissions:
  contents: read

jobs:
  test-off-computer-generation:
    if: github.repository == 'parksunup/globaltrend' && github.event.head_commit.message == 'Run isolated NotebookLM cloud generation test'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/podcast-cloud/requirements.txt
      - name: Generate and retrieve one unpublished test audio
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          python - <<'PY'
          import asyncio
          import logging
          import tempfile
          from pathlib import Path
          from notebooklm import NotebookLMClient
          from notebooklm.types import AudioFormat, AudioLength

          logging.disable(logging.CRITICAL)
          notebook_id = 'bd29d2e6-ae4b-4a52-9d8c-95e68712d974'
          source_id = '3af63b7f-727d-4900-af86-ecbe208c5ef6'

          async def main():
              async with NotebookLMClient.from_storage(allow_headless=False, rate_limit_max_retries=0, server_error_max_retries=0) as client:
                  await client.notebooks.list()
                  generated = await client.artifacts.generate_audio(
                      notebook_id,
                      source_ids=[source_id],
                      language='ko',
                      instructions='게시하지 않는 연결 시험입니다. 제공된 가상 자료만 한국어로 짧게 설명하세요.',
                      audio_format=AudioFormat.DEEP_DIVE,
                      audio_length=AudioLength.SHORT,
                  )
                  if not generated.task_id or generated.is_failed:
                      raise RuntimeError('audio request was not accepted')
                  print('TEST_TASK_ID', generated.task_id, flush=True)
                  for _ in range(55):
                      status = await client.artifacts.poll_status(notebook_id, generated.task_id)
                      if status.is_complete:
                          with tempfile.TemporaryDirectory(prefix='podcast-cloud-test-') as folder:
                              path = Path(folder) / 'audio.m4a'
                              await client.artifacts.download_audio(notebook_id, str(path), artifact_id=generated.task_id)
                              with path.open('rb') as stream:
                                  header = stream.read(8)
                              size = path.stat().st_size
                              if not 1 <= size <= 52_428_800 or header[4:8] != b'ftyp':
                                  raise RuntimeError('invalid audio')
                              print('CLOUD_GENERATION_AND_DOWNLOAD_OK', size)
                              return
                      if status.is_terminal:
                          raise RuntimeError('audio generation failed')
                      await asyncio.sleep(10)
                  raise RuntimeError('audio generation still pending; use TEST_TASK_ID to resume the same artifact')

          try:
              asyncio.run(main())
          except Exception:
              print('Cloud generation test did not finish; no credentials or audio were logged')
              raise SystemExit(1)
          PY
