name: Trend collector (manual validation)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight checks runtime, DB and sites without writes; write uses verified gates'
        type: choice
        options: [dry-run, probe, expansion-probe, crawlee-probe, crawlee-browser-probe, crawlee-worker, crawlee-preflight, scrapling-probe, preflight, write]
        default: dry-run
      http_client:
        description: 'Crawlee HTTP transport for read-only probes and collection'
        type: choice
        options: [auto, impit, httpx]
        default: auto
      source:
        description: 'Source selection for this manual validation run'
        type: choice
        options: [all, edpb, oecd, curia, cnil, ico, dpc, pdpc, ppc, ftc, ec, calprivacy, oaic, ca-opc, hk-pcpd, eu-parliament, eu-council, cn-cac, cn-tc260, es-aepd]
        default: all
      since:
        description: 'Optional backfill start YYYY-MM-DD (bounded; resume the same range)'
        type: string
      until:
        description: 'Optional end YYYY-MM-DD; default today in Korea'
        type: string
      max_items:
        description: 'Maximum documents per source for this run (1–100; default 30)'
        type: string
        default: '30'
      max_pages:
        description: 'Maximum listing pages per source for this run (1–50; default 10)'
        type: string
        default: '10'

# architecture.md 3.1 assigns collection scheduling to Supabase Cron + Queues.
# Keep Actions manual-only so merging this workflow cannot enable a second
# collection scheduler. Manual writes still require the existing runtime gates.
permissions:
  contents: read

concurrency:
  group: trend-collector-existing-project
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: ${{ fromJSON((contains(fromJSON('["expansion-probe","crawlee-probe","crawlee-preflight","scrapling-probe"]'), inputs.mode) || (inputs.mode == 'crawlee-worker' && inputs.source == 'all')) && '["diagnostic"]' || inputs.source && inputs.source != 'all' && format('["{0}"]', inputs.source) || '["edpb","oecd","curia","cnil","ico","dpc","pdpc","ppc","ftc"]') }}
    env:
      PYTHONUTF8: '1'
      COLLECTOR_RUNNER: github-hosted
      COLLECTOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REQUESTED_MODE: ${{ inputs.mode || 'dry-run' }}
      CRAWLEE_HTTP_CLIENT: ${{ inputs.http_client || 'auto' }}
      SCRAPLING_CHROME_TLS: ${{ inputs.mode == 'scrapling-probe' && inputs.http_client == 'httpx' && '1' || '0' }}
      SCRAPLING_OECD_ALTERNATE: ${{ inputs.mode == 'scrapling-probe' && inputs.http_client == 'impit' && '1' || '0' }}
      RUN_EVENT: ${{ github.event_name }}
      SCHEDULE_ENABLED: ${{ vars.SCHEDULE_ENABLED }}
      SOURCE_SELECTION: ${{ matrix.source }}
      RANGE_START: ${{ inputs.since }}
      RANGE_END: ${{ inputs.until }}
      MAX_ITEMS: ${{ inputs.max_items || '30' }}
      MAX_PAGES: ${{ inputs.max_pages || '10' }}
      COLLECTION_ENABLED: ${{ vars.COLLECTION_ENABLED }}
      FREE_LIMITS_VERIFIED: ${{ vars.FREE_LIMITS_VERIFIED }}
      CLOUD_PIPELINE_VERIFIED: ${{ vars.CLOUD_PIPELINE_VERIFIED }}
      SUPABASE_URL: ${{ !contains(fromJSON('["expansion-probe","crawlee-probe","crawlee-browser-probe","scrapling-probe"]'), inputs.mode) && secrets.COLLECTOR_SUPABASE_URL || '' }}
      SUPABASE_SECRET_KEY: ${{ !contains(fromJSON('["expansion-probe","crawlee-probe","crawlee-browser-probe","scrapling-probe"]'), inputs.mode) && secrets.COLLECTOR_SUPABASE_SECRET_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/collector/requirements.txt
      - name: Install experimental Scrapling probe
        if: inputs.mode == 'scrapling-probe'
        run: python -m pip install 'scrapling[fetchers]==0.5.1'
      - name: Install parallel Crawlee collector dependencies
        if: contains(fromJSON('["crawlee-probe","crawlee-browser-probe","crawlee-worker","crawlee-preflight"]'), inputs.mode)
        run: python -m pip install -r scripts/collector_v2/requirements.txt
      - name: Install optional Crawlee HTTPX client for comparison
        if: (inputs.mode == 'crawlee-probe' || inputs.mode == 'crawlee-worker') && (inputs.http_client == 'httpx' || inputs.http_client == 'auto')
        run: python -m pip install 'crawlee[httpx]==1.11.0'
      - name: Install Chromium for browser probe
        if: inputs.mode == 'crawlee-browser-probe' || (inputs.mode == 'crawlee-worker' && (inputs.source == 'ico' || inputs.source == 'eu-parliament'))
        run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_collector*.py'
      - name: Run parallel Crawlee regression suite
        if: contains(fromJSON('["crawlee-probe","crawlee-browser-probe","crawlee-worker","crawlee-preflight"]'), inputs.mode)
        run: python -m unittest discover -s tests -p 'test_v2_*.py'
      - name: Collect within explicit limits
        shell: bash
        env:
          COLLECTOR_ACTUAL_RUNNER: ${{ runner.environment }}
        run: |
          if [ "$REQUESTED_MODE" = "scrapling-probe" ]; then
            python -m scripts.collector_v2.scrapling_probe
            exit $?
          fi
          if [ "$REQUESTED_MODE" = "crawlee-probe" ] || [ "$REQUESTED_MODE" = "crawlee-browser-probe" ]; then
            args=(--output work/collector-v2-probe.json)
            if [ "${{ inputs.source }}" != "all" ]; then args+=(--source "${{ inputs.source }}"); fi
            if [ "$REQUESTED_MODE" = "crawlee-browser-probe" ] && [ "${{ inputs.source }}" != "all" ]; then args+=(--browser "${{ inputs.source }}"); fi
            python -m scripts.collector_v2.diagnose "${args[@]}"
            exit $?
          fi
          if [ "$REQUESTED_MODE" = "crawlee-worker" ]; then
            args=()
            if [ "${{ inputs.source }}" = "all" ]; then args+=(--all-owned); else args+=(--source "$SOURCE_SELECTION"); fi
            if [ "${{ inputs.source }}" = "ico" ] || [ "${{ inputs.source }}" = "eu-parliament" ]; then args+=(--browser); fi
            python -m scripts.collector_v2.worker "${args[@]}" --output work/collector-v2-worker.json
            exit $?
          fi
          if [ "$REQUESTED_MODE" = "crawlee-preflight" ]; then
            args=(--output work/collector-v2-preflight.json)
            if [ "$SOURCE_SELECTION" != "all" ] && [ "$SOURCE_SELECTION" != "diagnostic" ]; then args+=(--source "$SOURCE_SELECTION"); fi
            python -m scripts.collector_v2.preflight "${args[@]}"
            exit $?
          fi
          if [ "$REQUESTED_MODE" = "expansion-probe" ]; then
            python -m scripts.collector.diagnose --output work/collector-result.json
            exit $?
          fi
          if [ "$REQUESTED_MODE" = "preflight" ]; then
            args=(--output work/collector-result.json)
            if [ "$SOURCE_SELECTION" != "all" ]; then args+=(--source "$SOURCE_SELECTION"); fi
            python -m scripts.collector.preflight "${args[@]}"
            exit $?
          fi
          args=(--output work/collector-result.json)
          if [ "$REQUESTED_MODE" = "write" ]; then args+=(--write); fi
          if [ "$REQUESTED_MODE" = "probe" ]; then args+=(--probe); fi
          if [ "$SOURCE_SELECTION" != "all" ]; then args+=(--source "$SOURCE_SELECTION"); fi
          if [ -n "$RANGE_START" ]; then args+=(--since "$RANGE_START"); fi
          if [ -n "$RANGE_END" ]; then args+=(--until "$RANGE_END"); fi
          args+=(--max-items "$MAX_ITEMS" --max-pages "$MAX_PAGES")
          set +e
          python -m scripts.collector.run "${args[@]}"
          collector_exit=$?
          set -e
          if [ "$collector_exit" -eq 3 ]; then
            echo '::warning::Collection is partial; consult the JSON summary and saved resume cursor. Complete coverage is not verified.'
          else
            exit "$collector_exit"
          fi
      - name: Summarize bounded execution log without paid artifact storage
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib
          paths = [pathlib.Path('work/collector-result.json'),
                   pathlib.Path('work/collector-v2-probe.json'),
                   pathlib.Path('work/collector-v2-worker.json'),
                   pathlib.Path('work/collector-v2-preflight.json')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              for result in paths:
                  if result.exists():
                      output.write(f'### {result.name}\n```json\n')
                      output.write(result.read_text(encoding='utf-8')[:12000])
                      output.write('\n```\n')
          PY
