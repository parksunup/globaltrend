name: Trend collector (gated automation)

on:
  schedule:
    - cron: '17 22 * * *' # Next day 07:17 Asia/Seoul; default branch only.
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe checks live parsers without writes; write needs verified pipeline and secrets'
        type: choice
        options: [dry-run, probe, write]
        default: dry-run
      since:
        description: 'Optional backfill start YYYY-MM-DD (bounded; resume the same range)'
        type: string
      until:
        description: 'Optional end YYYY-MM-DD; default today in Korea'
        type: string

# The scheduled job is blocked before runner allocation unless every runtime
# switch is explicitly true. Defining cron on this PR branch does not activate
# it: GitHub schedules use the default branch. No variable is changed here.
permissions:
  contents: read

concurrency:
  group: trend-collector-existing-project
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name != 'schedule' ||
      (vars.SCHEDULE_ENABLED == 'true' &&
       vars.COLLECTION_ENABLED == 'true' &&
       vars.FREE_LIMITS_VERIFIED == 'true' &&
       vars.CLOUD_PIPELINE_VERIFIED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'write' || inputs.mode || 'dry-run' }}
      RUN_EVENT: ${{ github.event_name }}
      SCHEDULE_ENABLED: ${{ vars.SCHEDULE_ENABLED }}
      RANGE_START: ${{ inputs.since }}
      RANGE_END: ${{ inputs.until }}
      COLLECTION_ENABLED: ${{ vars.COLLECTION_ENABLED }}
      FREE_LIMITS_VERIFIED: ${{ vars.FREE_LIMITS_VERIFIED }}
      CLOUD_PIPELINE_VERIFIED: ${{ vars.CLOUD_PIPELINE_VERIFIED }}
      SUPABASE_URL: ${{ secrets.COLLECTOR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.COLLECTOR_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/collector/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_collector*.py'
      - name: Collect within explicit limits
        shell: bash
        run: |
          args=(--output work/collector-result.json)
          if [ "$REQUESTED_MODE" = "write" ]; then args+=(--write); fi
          if [ "$RUN_EVENT" = "schedule" ]; then args+=(--scheduled); fi
          if [ "$REQUESTED_MODE" = "probe" ]; then args+=(--probe); fi
          if [ -n "$RANGE_START" ]; then args+=(--since "$RANGE_START"); fi
          if [ -n "$RANGE_END" ]; then args+=(--until "$RANGE_END"); fi
          python -m scripts.collector.run "${args[@]}"
      - name: Summarize bounded execution log without paid artifact storage
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib
          result = pathlib.Path('work/collector-result.json')
          if result.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('```json\n' + result.read_text()[:12000] + '\n```\n')
          PY
