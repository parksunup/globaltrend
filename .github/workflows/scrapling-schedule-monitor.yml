name: Monitor 03:00 KST Scrapling collector

on:
  schedule:
    # Check five hours after the intended 03:00 KST collection start.
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    if: github.repository == 'parksunup/globaltrend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare scheduled starts with 03:00 KST
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("Asia/Seoul")
          now = dt.datetime.now(zone)
          url = (
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"
              "/actions/workflows/scrapling-daily-collector.yml/runs"
              "?event=schedule&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          runs = payload.get("workflow_runs", [])
          cutoff = now.date() - dt.timedelta(days=7)
          recent = []
          for run in runs:
              created = dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(zone)
              if created.date() < cutoff:
                  continue
              started_raw = run.get("run_started_at")
              started = (
                  dt.datetime.fromisoformat(started_raw.replace("Z", "+00:00")).astimezone(zone)
                  if started_raw else None
              )
              expected = dt.datetime.combine(created.date(), dt.time(3, 0), tzinfo=zone)
              observed = started or created
              delay = round((observed - expected).total_seconds() / 60, 1)
              recent.append({
                  "date": created.date().isoformat(),
                  "created": created.isoformat(),
                  "started": started.isoformat() if started else "not started",
                  "delay_minutes": delay,
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion") or "in progress",
                  "html_url": run.get("html_url"),
              })

          recent.sort(key=lambda item: (item["date"], item["created"]), reverse=True)
          today = [item for item in recent if item["date"] == now.date().isoformat()]
          lines = [
              "# 03:00 KST Scrapling collector schedule monitor",
              "",
              f"- Checked at: {now.isoformat()}",
              "- Expected collection start: 03:00 Asia/Seoul",
              "- This monitor records start delays; a late or missing run is not treated as data loss because the collector uses an overlapping multi-day window.",
              "",
              "## Today's scheduled run",
          ]
          if today:
              item = today[0]
              lines.extend([
                  f"- Started: {item['started']}",
                  f"- Delay from 03:00: {item['delay_minutes']} minutes",
                  f"- State: {item['status']} / {item['conclusion']}",
                  f"- Run: {item['html_url']}",
              ])
          else:
              lines.append("- No scheduled collector run was visible at monitor time; check the next monitor entry for a late start.")
          lines.extend(["", "## Recent scheduled runs (7 days)"])
          if recent:
              lines.append("| KST date | Started | Delay | State |")
              lines.append("|---|---:|---:|---|")
              for item in recent[:14]:
                  lines.append(
                      f"| {item['date']} | {item['started']} | {item['delay_minutes']} min "
                      f"| {item['status']} / {item['conclusion']} |"
                  )
          else:
              lines.append("- No scheduled runs found in the last seven days.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print(json.dumps({"checked_at": now.isoformat(), "recent_runs": recent[:14]}, ensure_ascii=False))
          PY
