name: One-time NotebookLM cloud smoke

on:
  push:
    branches: [codex/weekly-podcast-publication]
    paths: [.github/workflows/podcast-cloud-smoke.yml]

permissions:
  contents: read

jobs:
  verify-dedicated-session:
    if: github.repository == 'parksunup/globaltrend' && github.event.head_commit.message == 'Run isolated NotebookLM cloud smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/podcast-cloud/requirements.txt
      - name: Verify existing audio from a GitHub-hosted runner
        run: python scripts/podcast-cloud/verify_auth_download.py
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          SMOKE_NOTEBOOK_ID: bd29d2e6-ae4b-4a52-9d8c-95e68712d974
          SMOKE_ARTIFACT_ID: 31e7419b-3190-42b1-809e-497a2d629065
