name: NotebookLM dedicated login bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: notebooklm-cloud-podcast
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'parksunup/globaltrend' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NotebookLM authentication library
        run: python -m pip install -r scripts/podcast-cloud/requirements.txt
      - name: Exchange one-time Google login in cloud
        env:
          PODCAST_SESSION_KEY: ${{ secrets.PODCAST_SESSION_KEY }}
          PODCAST_ACCOUNT_EMAIL: ${{ secrets.PODCAST_ACCOUNT_EMAIL }}
          PODCAST_ENDPOINT: https://emlgwhkgaihhrirhdpnp.supabase.co/functions/v1/podcast-cloud
        run: python scripts/podcast-cloud/bootstrap.py
