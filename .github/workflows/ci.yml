name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  podcast-cloud-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/podcast-cloud/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_podcast_cloud.py'
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm validate:data
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/verify-content-traces.mjs

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Start local database and replay migrations
        run: |
          supabase db start
          supabase db reset --local
      - name: Test seed data and row-level security
        run: supabase test db --local
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/collector/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_collector*.py'
      - run: python scripts/verify-collector-dry-run.py

  collector-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --config supabase/functions/trend-collector/deno.json supabase/functions/trend-collector/index.ts
      - run: deno check --no-config supabase/functions/podcast-cloud/index.ts
      - run: deno test --allow-read --config supabase/functions/trend-collector/deno.json supabase/functions/trend-collector/adapter_test.ts supabase/functions/trend-collector/runtime_test.ts supabase/functions/trend-collector/expansion_test.ts supabase/functions/trend-collector/http_test.ts
      - name: Verify Edge registry matches the approved collector registry
        run: cmp config/trend-collector.json supabase/functions/trend-collector/registry.json
