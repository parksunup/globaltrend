name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm validate:data
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/verify-content-traces.mjs

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Start local database and replay migrations
        run: |
          supabase db start
          supabase db reset --local
      - name: Test seed data and row-level security
        run: supabase test db --local
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/collector/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_collector*.py'
      - run: python scripts/verify-collector-dry-run.py
