name: One-time monthly source backfill 2026-11-11 15:40 KST

on:
  schedule:
    - cron: '40 6 11 11 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: globaltrend-monthly-backfill-20261111
  cancel-in-progress: false

jobs:
  backfill:
    if: github.repository == 'parksunup/globaltrend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      COLLECTOR_RUNNER: github-hosted
      COLLECTOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_EVENT: schedule
      COLLECTOR_SINCE: '2026-10-11'
      COLLECTOR_UNTIL: '2026-11-11'
      SCHEDULE_ENABLED: ${{ vars.SCHEDULE_ENABLED }}
      COLLECTION_ENABLED: ${{ vars.COLLECTION_ENABLED }}
      FREE_LIMITS_VERIFIED: ${{ vars.FREE_LIMITS_VERIFIED }}
      CLOUD_PIPELINE_VERIFIED: ${{ vars.CLOUD_PIPELINE_VERIFIED }}
      SUPABASE_URL: ${{ secrets.COLLECTOR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.COLLECTOR_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.COLLECTOR_SUPABASE_SECRET_KEY }}
    steps:
      - name: Confirm this is the one scheduled date
        id: date_guard
        run: |
          if [ "$(date -u +%F)" = '2026-11-11' ] && [ '${{ github.event.schedule }}' = '40 6 11 11 *' ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.date_guard.outputs.proceed == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.date_guard.outputs.proceed == 'true'
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        if: steps.date_guard.outputs.proceed == 'true'
        run: |
          python -m pip install -r scripts/collector/requirements.txt
          python -m pip install -r scripts/collector-scrapling/requirements.txt
      - name: Collect 27 Crawlee routes for the monthly window
        if: steps.date_guard.outputs.proceed == 'true'
        env:
          COLLECTOR_ACTUAL_RUNNER: ${{ runner.environment }}
        run: >-
          python -m scripts.collector.run --scheduled --write --since "$COLLECTOR_SINCE"
          --until "$COLLECTOR_UNTIL" --source-set config/crawlee-daily-source-set.json
          --output work/monthly-crawlee-result.json
      - name: Collect OECD and five other Scrapling routes for the monthly window
        if: steps.date_guard.outputs.proceed == 'true'
        shell: bash
        run: |
          set +e
          python -m scripts.collector_oecd_rss.cloud_worker
          oecd_status=$?
          python -m scripts.collector_scrapling.cloud_worker
          scrapling_status=$?
          if [ "$oecd_status" -ne 0 ]; then exit "$oecd_status"; fi
          exit "$scrapling_status"
      - name: Disable this one-time schedule after its occurrence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow disable 'One-time monthly source backfill 2026-11-11 15:40 KST' --repo "$GH_REPO" || true
