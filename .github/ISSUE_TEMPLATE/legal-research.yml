name: 법제 조사 작업
description: 법제 담당의 공식 판본·번역 출처 조사 작업을 배정합니다.
title: "[법제] "
labels: ["legal-research"]
body:
  - type: markdown
    attributes:
      value: |
        이 작업은 `feat/legal-corpus-foundation` 브랜치에서 진행합니다.
        앱, Supabase, 인증과 환경변수는 수정하지 않습니다.
  - type: input
    id: scope
    attributes:
      label: 조사 범위
      description: 확인할 법률이나 관할권을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 먼저 확인할 공식 자료
      description: 리드가 제공하는 원본 파일이나 공식 URL을 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: outputs
    attributes:
      label: 완료 조건
      options:
        - label: `data/legal/instruments.md`를 작성했습니다.
          required: true
        - label: `data/legal/instruments.csv`를 작성했습니다.
          required: true
        - label: `data/legal/review-notes.md`에 근거와 불확실성을 기록했습니다.
          required: true
        - label: `pnpm validate:data`를 통과했습니다.
          required: true
