name: 동향 출처 조사 작업
description: 동향 담당의 공식 출처·수집 규칙 조사 작업을 배정합니다.
title: "[동향] "
labels: ["trend-research"]
body:
  - type: markdown
    attributes:
      value: |
        이 작업은 `feat/trend-source-contracts` 브랜치에서 진행합니다.
        앱, Supabase, 인증과 환경변수는 수정하지 않습니다.
  - type: input
    id: scope
    attributes:
      label: 조사할 출처
      description: EDPB, OECD, CURIA 중 이번 작업 범위를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 먼저 확인할 공식 페이지
      description: 시작 URL과 확인할 자료 유형을 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: outputs
    attributes:
      label: 완료 조건
      options:
        - label: `data/trends/source-configs/`에 출처별 Markdown을 작성했습니다.
          required: true
        - label: Markdown과 같은 ID를 사용하는 JSON을 작성했습니다.
          required: true
        - label: `data/trends/review-notes.md`에 포함·제외·실패 사유를 기록했습니다.
          required: true
        - label: `pnpm validate:data`를 통과했습니다.
          required: true
